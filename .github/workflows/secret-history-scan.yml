name: Secret History Scan

# Deep audit of every reachable commit on all fetched branches and tags. This is
# intentionally separate from the fast, required filesystem scan in
# secret-scan.yml so pull requests do not pay the full-history cost.
on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC, before the advisory CodeQL scan at 05:00 UTC.
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    name: Secret History Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify complete checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "::error::Refusing to scan a shallow checkout; full history is required."
            exit 1
          fi

          ref_count=$(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags | wc -l)
          if [[ "$ref_count" -eq 0 ]]; then
            echo "::error::Refusing to scan without fetched branch or tag refs."
            exit 1
          fi
          echo "::notice::Full-history scan will inspect all commits reachable from $ref_count fetched refs."

      - name: Run gitleaks across Git history
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "Downloading gitleaks v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 120 --retry 3 \
            "$URL" -o "/tmp/${TARBALL}"
          echo "${GITLEAKS_SHA256}  /tmp/${TARBALL}" | sha256sum --check --strict
          tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks git --log-opts="--all" --redact=100 --no-banner --exit-code 1 .
