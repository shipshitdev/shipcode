name: CI

# Trunk-based: master is the single trunk. PRs target master; pushes to master
# (post-merge) run the full suite. `workflow_call` lets the `full` orchestrator
# (.github/workflows/full.yml) chain CI → E2E in one dispatch.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
  workflow_call:

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22"

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fork-PR gate: external contributors don't burn CI or touch secrets until a
  # maintainer reviews the code and adds the `run-ci` label. Same-repo PRs and
  # all non-PR events are trusted automatically.
  trust:
    name: Trust Check
    runs-on: ubuntu-latest
    outputs:
      is-trusted: ${{ steps.non_pr.outputs.trusted || steps.check.outputs.trusted }}
    steps:
      - name: Allow non-PR events
        id: non_pr
        if: github.event_name != 'pull_request'
        run: echo "trusted=true" >> "$GITHUB_OUTPUT"

      - name: Check contributor trust
        id: check
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const trustedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const isSameRepository =
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const isTrusted = isSameRepository || trustedRoles.includes(pr.author_association);
            const hasLabel = pr.labels.some(l => l.name === 'run-ci');

            if (isTrusted) {
              core.info(isSameRepository ? 'same-repo PR - CI allowed' : `trusted contributor (${pr.author_association}) - CI allowed`);
              core.setOutput('trusted', 'true');
            } else if (hasLabel) {
              core.info('External contributor with run-ci label - CI allowed');
              core.setOutput('trusted', 'true');
            } else {
              core.setOutput('trusted', 'false');
              core.setFailed(
                `External contributor (${pr.author_association}) - add the \`run-ci\` label to allow CI. ` +
                'A maintainer must review the code and add the label.'
              );
            }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cache-turbo: 'false'
      # Biome scans the whole repo in well under a minute — no affected scoping needed.
      - run: bun run lint
      # AGENTS.md is generated from .agents/memory/ by scripts/sync-agent-memory.sh.
      # This gate fails if the committed AGENTS.md's repo-memory section drifted
      # from those files (author forgot to re-run the script) or if AGENTS.md grew
      # past Codex's 32 KiB hard-truncation limit. The global section is derived
      # from a private, non-repo memory dir and is intentionally not checked here.
      - name: Verify AGENTS.md is in sync and under the Codex size limit
        run: bash scripts/sync-agent-memory.sh --check

  design:
    name: Design System
    runs-on: ubuntu-latest
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cache-turbo: 'false'
      - run: bun run lint:design

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          turbo-key-prefix: typecheck
      - name: Typecheck (affected on PRs, full otherwise)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" bunx turbo run typecheck --affected
          else
            bun run typecheck
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, lint, typecheck]
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          turbo-key-prefix: build
      # Desktop's `build` script runs electron-builder (installer packaging), so it is
      # excluded from the turbo sweep and compiled via its `build:code` script instead.
      - name: Build packages and apps (affected on PRs, full otherwise)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" bunx turbo run build --filter='!@shipcode/desktop' --affected
          else
            bunx turbo run build --filter='!@shipcode/desktop'
          fi
      - name: Build desktop app code (no installer)
        run: |
          bunx turbo run build --filter='@shipcode/desktop^...'
          bun run --filter @shipcode/desktop build:code

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          turbo-key-prefix: test
          install-ripgrep: 'true'
      - name: Test (affected on PRs, full otherwise)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" bunx turbo run test --affected -- --maxWorkers=2
          else
            bun run test:ci
          fi

  # Coverage is decoupled from the PR gate: it runs on a weekly cron, on demand,
  # and on push to master — never blocking a PR. Threshold lives in COVERAGE_MIN.
  coverage:
    name: Coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: trust
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          turbo-key-prefix: coverage
          install-ripgrep: 'true'
      # Floors match the release contract in scripts/coverage-summary.mjs defaults
      # (docs/coverage-leftovers.md): lines/statements/functions 95, branches 90.
      - name: Run sharded full-repo coverage
        env:
          COVERAGE_MIN: '95'
          COVERAGE_BRANCH_MIN: '90'
        shell: bash
        run: |
          set -euo pipefail
          bun run coverage | tee coverage-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          retention-days: 7
          path: |
            coverage-summary.txt
            apps/*/coverage/**
            packages/*/coverage/**
