name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.1.0). Must match an existing GitHub release."
        required: true
        type: string
      deploy_web:
        description: "Deploy apps/web to Vercel production"
        required: false
        type: boolean
        default: true
      build_linux:
        description: "Build + upload desktop Linux installers (AppImage + deb)"
        required: false
        type: boolean
        default: true
      build_macos:
        description: "Build + upload desktop macOS installers (signed + notarized dmg + zip)"
        required: false
        type: boolean
        default: true
      update_homebrew:
        description: "Update the shipcode cask in shipshitdev/homebrew-tap"
        required: false
        type: boolean
        default: true
      publish_cli:
        description: "Publish the CLI to npm via Trusted Publisher"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# Keep BUN_VERSION in lockstep with ci.yml/e2e.yml and the setup-bun-env default —
# release artifacts must be built on the same toolchain CI validated.
env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22"

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and app versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release_tag is required"
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must be a v-prefixed semver tag, got '$RELEASE_TAG'"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          CLI_VERSION=$(node -p "require('./apps/cli/package.json').version")
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")

          if [ "$CLI_VERSION" != "$DESKTOP_VERSION" ]; then
            echo "::error::apps/cli ($CLI_VERSION) and apps/desktop ($DESKTOP_VERSION) versions must match"
            exit 1
          fi

          if [ "$CLI_VERSION" != "$VERSION" ]; then
            echo "::error::release tag $RELEASE_TAG does not match app versions $CLI_VERSION"
            exit 1
          fi

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release-quality:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep build-essential python3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:ci
      - name: Build docs export
        run: bun run sync:docs
      - name: Build web
        run: bun run build:web
      - name: Build CLI package
        run: bun run turbo run build --filter=@shipshitdev/shipcode
      - name: Smoke-test CLI entrypoint
        run: node apps/cli/dist/index.js --help
      - name: Build desktop app code
        run: cd apps/desktop && bun run build:code

  deploy-web:
    if: ${{ github.event_name == 'release' || inputs.deploy_web }}
    needs:
      - validate-release
      - release-quality
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: "prj_em8zYt0Lxin5PqxObNI47qBl2fOa"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Vercel CLI
        run: npm install --global vercel@50.7.1
      - name: Install dependencies
        run: bun install
      - name: Sync docs into web bundle
        run: bun run sync:docs
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Build Vercel artifact
        run: vercel build --prod --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy web to Vercel production
        run: vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"

  build-desktop-linux:
    if: ${{ github.event_name == 'release' || inputs.build_linux }}
    needs:
      - validate-release
      - release-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: bun install
      - name: Build desktop dependencies
        run: bun run turbo run build --filter=@shipcode/desktop^...
      - name: Build desktop app
        run: cd apps/desktop && bun run build:code
      - name: Package Linux installers
        run: cd apps/desktop && npx electron-builder --linux --publish never
      - name: Upload Linux binaries to release
        run: |
          gh release upload "${{ needs.validate-release.outputs.release_tag }}" \
            apps/desktop/out/*.AppImage \
            apps/desktop/out/*.deb \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-macos:
    if: ${{ github.event_name == 'release' || inputs.build_macos }}
    needs:
      - validate-release
      - release-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install
      - name: Build desktop dependencies
        run: bun run turbo run build --filter=@shipcode/desktop^...
      - name: Build desktop app
        run: cd apps/desktop && bun run build:code
      # Fail fast with a clear message if any signing/notarization credential is
      # missing, rather than letting electron-builder emit a cryptic error or
      # (worse) silently fall back to an unsigned build.
      #
      # Naming matches VincentShipsIt/macsweep: sensitive key material lives in
      # secrets, non-sensitive identifiers (key id / issuer / team) in variables.
      - name: Verify signing + notarization credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=0
          for v in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD APPLE_API_PRIVATE_KEY_P8_BASE64 \
                   APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing required credential: $v"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

      # electron-builder / notarytool wants the API key as a file path. The
      # secret holds the base64 of the .p8; decode it into the runner temp dir.
      - name: Write App Store Connect API key
        id: asc
        env:
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Package, sign, and notarize macOS installers
        run: cd apps/desktop && npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.signed.yml --publish never
        env:
          # electron-builder imports this cert (base64 .p12) into a disposable
          # keychain and signs with the Developer ID identity in the signed config.
          CSC_LINK: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          # Notarization via App Store Connect API key (notarytool).
          APPLE_API_KEY: ${{ steps.asc.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      # electron-builder notarizes + staples the .app, but the DMG container it
      # then packs never gets its own ticket — Gatekeeper still accepts the app
      # inside, but the DMG can't be validated offline and `stapler validate`
      # fails. Submit each DMG for its own notarization and staple it, so the
      # artifact users (and the Homebrew cask) download is self-contained.
      - name: Notarize and staple DMGs
        run: |
          set -e
          for dmg in apps/desktop/out/*.dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "${{ steps.asc.outputs.key_path }}" \
              --key-id "${{ vars.APPLE_API_KEY_ID }}" \
              --issuer "${{ vars.APPLE_API_ISSUER_ID }}" \
              --team-id "${{ vars.APPLE_TEAM_ID }}" \
              --wait --timeout 30m
            xcrun stapler staple "$dmg"
          done

      - name: Verify Developer ID signature + stapled notarization
        run: |
          set -e
          APP=$(find apps/desktop/out -maxdepth 3 -name 'ShipCode.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "::error::ShipCode.app not found in out/"; exit 1; fi
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -i 'Authority=Developer ID Application'
          echo "Stapler validate $APP"
          xcrun stapler validate "$APP"
          for dmg in apps/desktop/out/*.dmg; do
            echo "Stapler validate $dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Upload macOS binaries to release
        run: |
          gh release upload "${{ needs.validate-release.outputs.release_tag }}" \
            apps/desktop/out/*.dmg \
            apps/desktop/out/*.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-cask:
    if: ${{ (github.event_name == 'release' && vars.HOMEBREW_PUBLISH_ENABLED == 'true') || (inputs.build_macos && inputs.update_homebrew) }}
    needs:
      - validate-release
      - build-desktop-macos
    runs-on: ubuntu-latest
    steps:
      - name: Verify TAP_GITHUB_TOKEN secret
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN repository secret not set"
            exit 1
          fi
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: shipshitdev/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          ref: master
      - name: Download macOS release artifacts
        run: |
          gh release download "${{ needs.validate-release.outputs.release_tag }}" \
            --repo shipshitdev/shipcode \
            --pattern "*.dmg" \
            --dir ./artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute SHA256 hashes
        id: sha
        run: |
          ARM_FILE=$(find artifacts -maxdepth 1 -type f -name "*-arm64.dmg" | head -n 1)
          INTEL_FILE=$(find artifacts -maxdepth 1 -type f -name "*-x64.dmg" | head -n 1)
          if [ -n "$ARM_FILE" ]; then
            echo "arm_sha=$(shasum -a 256 "$ARM_FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$INTEL_FILE" ]; then
            echo "intel_sha=$(shasum -a 256 "$INTEL_FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify both SHA256 outputs present
        run: |
          if [ -z "${{ steps.sha.outputs.arm_sha }}" ]; then
            echo "::error::no arm64 dmg found in release artifacts"; exit 1
          fi
          if [ -z "${{ steps.sha.outputs.intel_sha }}" ]; then
            echo "::error::no x64 dmg found in release artifacts"; exit 1
          fi
      - name: Update cask version and SHA256
        run: |
          cat > Casks/shipcode.rb <<'RUBY'
          cask "shipcode" do
            version "${{ needs.validate-release.outputs.version }}"
            arch arm: "arm64", intel: "x64"

            sha256 arm:   "${{ steps.sha.outputs.arm_sha }}",
                   intel: "${{ steps.sha.outputs.intel_sha }}"

            url "https://github.com/shipshitdev/shipcode/releases/download/v#{version}/ShipCode-#{version}-#{arch}.dmg",
                verified: "github.com/shipshitdev/shipcode/"
            name "ShipCode"
            desc "AI-driven dev pipeline orchestrator for GitHub issues"
            homepage "https://shipcode.shipshit.dev"

            app "ShipCode.app"

            zap trash: [
              "~/Library/Application Support/ShipCode",
              "~/Library/Logs/ShipCode",
              "~/Library/Preferences/dev.shipshit.shipcode.plist",
            ]
          end
          RUBY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shipcode.rb
          if git diff --cached --quiet; then
            echo "Cask already matches ${{ needs.validate-release.outputs.release_tag }}; skipping commit."
            exit 0
          fi
          git commit -m "chore: bump shipcode to ${{ needs.validate-release.outputs.release_tag }}"
          git push

  publish-cli:
    if: ${{ (github.event_name == 'release' && vars.NPM_PUBLISH_ENABLED == 'true') || inputs.publish_cli }}
    needs:
      - validate-release
      - release-quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Node 24 (not the repo-wide 22) is deliberate: npm Trusted Publishing (OIDC,
      # --provenance) needs npm >= 11.5, which ships with Node 24. Node 22 bundles npm 10.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - name: Build CLI and dependencies
        run: bun run turbo run build --filter=@shipshitdev/shipcode
      - name: Smoke-test packaged CLI entrypoint
        run: node apps/cli/dist/index.js --help
      - name: Check npm package version
        id: npm-package
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          set +e
          NPM_VIEW_OUTPUT=$(npm view "@shipshitdev/shipcode@${VERSION}" version 2>&1)
          NPM_VIEW_STATUS=$?
          set -e

          if [ "$NPM_VIEW_STATUS" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@shipshitdev/shipcode@${VERSION} is already published; skipping npm publish."
          elif echo "$NPM_VIEW_OUTPUT" | grep -qiE 'E404|404 Not Found|No match found|not found'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to check npm package @shipshitdev/shipcode@${VERSION}"
            echo "$NPM_VIEW_OUTPUT"
            exit "$NPM_VIEW_STATUS"
          fi
      - name: Publish to npm (OIDC / Trusted Publisher)
        if: steps.npm-package.outputs.published != 'true'
        run: cd apps/cli && npm publish --access public --provenance
        # No NODE_AUTH_TOKEN. Authentication happens via OIDC — the npm
        # registry verifies the GitHub Actions ID token against the
        # Trusted Publisher config on the package. One-time setup at
        # https://www.npmjs.com/package/@shipshitdev/shipcode/access
        # (Repository: shipshitdev/shipcode, Workflow: publish.yml).
