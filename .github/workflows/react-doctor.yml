name: React Doctor

on:
  pull_request:
    branches: [develop, staging, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: millionco/react-doctor@main
        with:
          # Full-repo scan (not diff) so every workspace + dead-code analysis
          # is covered, not just files changed in the PR.
          diff: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
