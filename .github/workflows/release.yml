name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.11"
  NODE_VERSION: "22"
  VERCEL_PROJECT_ID_WEB: "prj_em8zYt0Lxin5PqxObNI47qBl2fOa"

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Vercel CLI
        run: npm install --global vercel@50.7.1
      - name: Install dependencies
        run: bun install
      - name: Sync docs into web bundle
        run: bun run sync:docs
      - name: Pull Vercel project settings
        run: vercel pull --cwd apps/web --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Build Vercel artifact
        run: vercel build --cwd apps/web --prod --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy web to Vercel production
        run: vercel deploy --cwd apps/web --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"

  build-desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: bun install
      - name: Build desktop app
        run: cd apps/desktop && bun run build:code
      - name: Package Linux installers
        run: cd apps/desktop && npx electron-builder --linux
      - name: Upload Linux binaries to release
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            apps/desktop/out/*.AppImage \
            apps/desktop/out/*.deb \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Detect macOS signing configuration
        id: macos-signing
        run: |
          if [ -z "${{ secrets.CSC_LINK }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CSC_LINK is not configured; skipping macOS release build."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.macos-signing.outputs.enabled == 'true'
        run: bun install
      - name: Build desktop app
        if: steps.macos-signing.outputs.enabled == 'true'
        run: cd apps/desktop && bun run build:code
      - name: Package macOS installers
        if: steps.macos-signing.outputs.enabled == 'true'
        run: cd apps/desktop && npx electron-builder --mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS binaries to release
        if: steps.macos-signing.outputs.enabled == 'true'
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            apps/desktop/out/*.dmg \
            apps/desktop/out/*.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-cask:
    needs: build-desktop-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: shipshitdev/homebrew-shipcode
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: master

      - name: Download macOS release artifacts
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          gh release download "v${VERSION}" \
            --repo shipshitdev/shipcode \
            --pattern "*.dmg" \
            --dir ./artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SHA256 hashes
        id: sha
        run: |
          ARM_FILE=$(ls artifacts/*arm64*.dmg 2>/dev/null | head -1)
          INTEL_FILE=$(ls artifacts/*.dmg 2>/dev/null | grep -v arm64 | head -1)
          if [ -n "$ARM_FILE" ]; then
            echo "arm_sha=$(shasum -a 256 "$ARM_FILE" | awk '{print $1}')" >> $GITHUB_OUTPUT
          fi
          if [ -n "$INTEL_FILE" ]; then
            echo "intel_sha=$(shasum -a 256 "$INTEL_FILE" | awk '{print $1}')" >> $GITHUB_OUTPUT
          fi

      - name: Update cask version and SHA256
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/shipcode.rb
          if [ -n "${{ steps.sha.outputs.arm_sha }}" ]; then
            sed -i "s|arm:   \"[a-f0-9]*\"|arm:   \"${{ steps.sha.outputs.arm_sha }}\"|" Casks/shipcode.rb
          fi
          if [ -n "${{ steps.sha.outputs.intel_sha }}" ]; then
            sed -i "s|intel: \"[a-f0-9]*\"|intel: \"${{ steps.sha.outputs.intel_sha }}\"|" Casks/shipcode.rb
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shipcode.rb
          git commit -m "chore: bump shipcode to ${{ github.event.release.tag_name }}"
          git push

  publish-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - name: Build CLI and dependencies
        run: bun run turbo run build --filter=shipcode
      - name: Set version from release tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          cd apps/cli && npm version "$VERSION" --no-git-tag-version
      - name: Publish to npm
        run: cd apps/cli && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
