name: Release

# Manual-dispatch only until Apple signing / notarization is wired.
# When CSC_LINK + APPLE_* secrets are available, re-enable the
# `release: published` trigger below and restore the commented
# `build-desktop-macos` + `update-homebrew-cask` jobs at the bottom.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.1.0). Must match an existing GitHub release for Linux uploads."
        required: true
        type: string
      deploy_web:
        description: "Deploy apps/web to Vercel production"
        required: false
        type: boolean
        default: true
      build_linux:
        description: "Build + upload desktop Linux installers (AppImage + deb)"
        required: false
        type: boolean
        default: true
      publish_cli:
        description: "Publish the CLI to npm (requires NPM_TOKEN secret)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.11"
  NODE_VERSION: "22"
  VERCEL_PROJECT_ID_WEB: "prj_em8zYt0Lxin5PqxObNI47qBl2fOa"

jobs:
  deploy-web:
    if: ${{ inputs.deploy_web }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Vercel CLI
        run: npm install --global vercel@50.7.1
      - name: Install dependencies
        run: bun install
      - name: Sync docs into web bundle
        run: bun run sync:docs
      - name: Pull Vercel project settings
        run: vercel pull --cwd apps/web --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Build Vercel artifact
        run: vercel build --cwd apps/web --prod --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy web to Vercel production
        run: vercel deploy --cwd apps/web --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"

  build-desktop-linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: bun install
      - name: Build desktop app
        run: cd apps/desktop && bun run build:code
      - name: Package Linux installers
        run: cd apps/desktop && npx electron-builder --linux
      - name: Upload Linux binaries to release
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            apps/desktop/out/*.AppImage \
            apps/desktop/out/*.deb \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-cli:
    if: ${{ inputs.publish_cli }}
    runs-on: ubuntu-latest
    # id-token: write is required for npm Trusted Publishers (OIDC).
    # contents: read is required for actions/checkout. The job-level
    # permissions block fully replaces the top-level, so we re-declare
    # contents: read explicitly.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - name: Build CLI and dependencies
        run: bun run turbo run build --filter=@shipshitdev/shipcode
      - name: Set version from release tag
        run: |
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          cd apps/cli && npm version "$VERSION" --no-git-tag-version
      - name: Publish to npm (OIDC / Trusted Publisher)
        run: cd apps/cli && npm publish --access public --provenance
        # No NODE_AUTH_TOKEN. Authentication happens via OIDC — the npm
        # registry verifies the GitHub Actions ID token against the
        # Trusted Publisher config on the package. One-time setup at
        # https://www.npmjs.com/package/@shipshitdev/shipcode/access
        # (Repository: shipshitdev/shipcode, Workflow: release.yml).

