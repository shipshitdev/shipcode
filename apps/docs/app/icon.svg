<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="shipcode-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shipcode-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shipcode-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.15" />
    </linearGradient>
    <filter id="shipcode-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#shipcode-bg)"/>
  <rect
    width="1024"
    height="1024"
    rx="230"
    ry="230"
    fill="none"
    stroke="url(#shipcode-accent)"
    stroke-width="2"
    opacity="0.15"
  />
  <ellipse cx="512" cy="510" rx="260" ry="260" fill="url(#shipcode-glow)" filter="url(#shipcode-soft-glow)"/>
  <polyline
    points="350,340 255,512 350,684"
    fill="none"
    stroke="url(#shipcode-accent)"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <polyline
    points="674,340 769,512 674,684"
    fill="none"
    stroke="url(#shipcode-accent)"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <line x1="572" y1="320" x2="452" y2="704" stroke="url(#shipcode-accent)" stroke-width="56" stroke-linecap="round" opacity="1"/>
  <line x1="312" y1="800" x2="712" y2="800" stroke="url(#shipcode-accent)" stroke-width="2" opacity="0.2"/>
</svg>
