<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShipCode — Splash Preview</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #050607;
  --panel: #0b0d10;
  --border: rgba(255, 255, 255, 0.06);
  --primary: #f4f4f5;
  --secondary: #a1a1aa;
  --muted: #52525b;
  --agent: #38bdf8;
  --success: #22c55e;
  --success-muted: rgba(34, 197, 94, 0.5);
  --danger: #ef4444;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: 400px;
  padding: 32px 24px;
}

header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
}

.mark {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}

h1 {
  margin: 0;
  font-size: 18px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.list-wrapper {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  overflow: hidden;
}

.progress-track {
  height: 2px;
  background: rgba(255, 255, 255, 0.04);
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  transition: width 0.4s ease;
}

ol {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 10px;
  align-items: center;
  padding: 9px 14px;
  transition: opacity 0.25s ease, background 0.25s ease;
}

li + li { border-top: 1px solid var(--border); }

li.pending { opacity: 0.4; }
li.active { opacity: 1; background: rgba(56, 189, 248, 0.04); }
li.complete { opacity: 0.7; }
li.error { opacity: 1; background: rgba(239, 68, 68, 0.04); }

.copy { min-width: 0; }

.label {
  display: block;
  font-size: 13px;
  line-height: 18px;
  font-weight: 500;
  color: var(--muted);
}

.active .label { color: var(--primary); font-weight: 600; }
.complete .label { color: var(--secondary); font-weight: 500; }
.error .label { color: var(--danger); font-weight: 600; }

.detail {
  display: block;
  margin-top: 1px;
  color: var(--muted);
  font-size: 11px;
  line-height: 15px;
}

.active .detail { color: var(--secondary); }

.icon {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.icon svg {
  width: 18px;
  height: 18px;
  display: block;
}

.active .icon svg { animation: spin 0.8s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Preview controls */
.preview-controls {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 100;
}
.preview-controls button {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--secondary);
  font-size: 12px;
  cursor: pointer;
}
.preview-controls button:hover {
  color: var(--primary);
  border-color: var(--agent);
}

.window-frame {
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  overflow: hidden;
  width: 440px;
}
  </style>
</head>
<body>
  <div class="window-frame">
  <main>
    <header>
      <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="140 150 780 720" width="36" height="36"><rect x="184" y="192" width="176" height="500" rx="56" ry="56" fill="#45aaf2"/><rect x="424" y="192" width="176" height="560" rx="56" ry="56" fill="#20bf6b"/><rect x="664" y="192" width="176" height="620" rx="56" ry="56" fill="#a55eea"/></svg></div>
      <h1>Starting ShipCode</h1>
    </header>
    <div class="list-wrapper">
      <div class="progress-track"><div class="progress-fill" id="progress" style="width: 0%"></div></div>
      <ol id="steps"></ol>
    </div>
  </main>
  </div>

  <div class="preview-controls">
    <button onclick="showState('all-pending')">All Pending</button>
    <button onclick="showState('mid-boot')">Mid-Boot</button>
    <button onclick="showState('all-done')">All Done</button>
    <button onclick="showState('error')">Error</button>
    <button onclick="showState('animate')">Animate</button>
  </div>

  <script>
    var stepsEl = document.getElementById('steps');
    var progressEl = document.getElementById('progress');

    var BASE_STEPS = [
      { id: 'window',   label: 'Create app window',       status: 'pending' },
      { id: 'database', label: 'Open local database',     status: 'pending' },
      { id: 'services', label: 'Start desktop services',  status: 'pending' },
      { id: 'pipeline', label: 'Restore pipeline state',  status: 'pending' },
      { id: 'ipc',      label: 'Register app bridge',     status: 'pending' },
      { id: 'renderer', label: 'Load workspace',          status: 'pending' },
    ];

    var icons = {
      pending: '<svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="7.5" stroke="#52525b" stroke-width="1.5"/></svg>',
      active: '<svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="7.5" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/><path d="M9 1.5A7.5 7.5 0 0 1 16.5 9" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/></svg>',
      complete: '<svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="7.5" stroke="rgba(34,197,94,0.5)" stroke-width="1.5"/><path d="M5.5 9.5L7.5 11.5L12.5 6.5" stroke="rgba(34,197,94,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      error: '<svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="8.5" fill="rgba(239,68,68,0.18)" stroke="#ef4444" stroke-width="1"/><path d="M6.5 6.5L11.5 11.5M11.5 6.5L6.5 11.5" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/></svg>'
    };

    function render(steps) {
      var done = steps.filter(function(s) { return s.status === 'complete'; }).length;
      var pct = Math.round((done / steps.length) * 100);
      progressEl.style.width = pct + '%';
      stepsEl.innerHTML = steps.map(function(step) {
        return '<li class="' + step.status + '">' +
          '<span class="icon">' + icons[step.status] + '</span>' +
          '<span class="copy">' +
            '<span class="label">' + step.label + '</span>' +
            (step.detail ? '<span class="detail">' + step.detail + '</span>' : '') +
          '</span>' +
        '</li>';
      }).join('');
    }

    var STATES = {
      'all-pending': function() { return BASE_STEPS.map(function(s) { return Object.assign({}, s); }); },
      'mid-boot': function() { return BASE_STEPS.map(function(s, i) {
        return Object.assign({}, s, {
          status: i < 2 ? 'complete' : i === 2 ? 'active' : 'pending',
          detail: i === 2 ? 'Initializing agent pool…' : undefined
        });
      }); },
      'all-done': function() { return BASE_STEPS.map(function(s) { return Object.assign({}, s, { status: 'complete' }); }); },
      'error': function() { return BASE_STEPS.map(function(s, i) {
        return Object.assign({}, s, {
          status: i < 3 ? 'complete' : i === 3 ? 'error' : 'pending',
          detail: i === 3 ? 'Connection to database failed' : undefined
        });
      }); }
    };

    function showState(name) {
      if (name === 'animate') { animateBoot(); return; }
      render(STATES[name]());
    }

    function animateBoot() {
      var steps = BASE_STEPS.map(function(s) { return Object.assign({}, s); });
      render(steps);
      var i = 0;
      var interval = setInterval(function() {
        if (i > 0) steps[i - 1].status = 'complete';
        if (i < steps.length) {
          steps[i].status = 'active';
          steps[i].detail = 'Working…';
        }
        render(steps);
        i++;
        if (i > steps.length) clearInterval(interval);
      }, 600);
    }

    showState('mid-boot');
  </script>
</body>
</html>
